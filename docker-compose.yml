services:
  db:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: rental_dev
      POSTGRES_USER: rental_dev
      POSTGRES_PASSWORD: local_only
    volumes:
      - rental_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental_dev -d rental_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  rental_dev_data:
